<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad-logo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-beam-logo" x1="12" y1="50" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="secondary-beam-logo" x1="52" y1="50" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cross-facet-logo" x1="18" y1="38" x2="46" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="spark-glow-logo" cx="32" cy="28" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="subtle-glow-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container with Subtle Border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad-logo)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="28" r="16" fill="url(#spark-glow-logo)" />

  <!-- Aether Prism 'A' Geometry -->
  <g filter="url(#subtle-glow-logo)">
    <!-- Left Ascender / Prism Facet -->
    <path d="M32 13L16 48C15.5 49.2 16.6 50.5 17.9 50L32 44.5L32 13Z" fill="url(#primary-beam-logo)" />
    
    <!-- Right Ascender / Prism Facet -->
    <path d="M32 13L48 48C48.5 49.2 47.4 50.5 46.1 50L32 44.5L32 13Z" fill="url(#secondary-beam-logo)" opacity="0.9" />

    <!-- Dimensional Analytical Cross-Core (Crystal Delta) -->
    <path d="M22 37L32 32L42 37L32 42L22 37Z" fill="url(#cross-facet-logo)" />
    
    <!-- Pulse Spark Core -->
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
    <circle cx="32" cy="13" r="2" fill="#38bdf8" />
  </g>
</svg>

